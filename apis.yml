apis:
- aid: numeral:filings
  name: Numeral Filings API
  tags:
  - Filings
  - Remittance
  - Autofile
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.numeral.com/product/api
  baseURL: https://api.numeralhq.com
  properties:
  - url: https://docs.numeral.com/api-reference/introduction
    type: Documentation
  - url: https://www.numeral.com/pricing
    type: Plans
  description: >-
    Sales-tax return filing and remittance (Autofile) across all US states, driven by recorded transactions.
    Filing and remittance are delivered as managed platform services rather than self-serve public REST
    endpoints; transaction data captured via the API flows into them.
- aid: numeral:registrations-nexus
  name: Numeral Registrations & Nexus API
  tags:
  - Registrations
  - Nexus
  - Monitoring
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.numeral.com/product/api
  baseURL: https://api.numeralhq.com
  properties:
  - url: https://docs.numeral.com/api-reference/introduction
    type: Documentation
  - url: https://www.numeral.com/pricing
    type: Plans
  description: >-
    State sales-tax registration (Autoregister) and physical/economic nexus monitoring with state-crossing
    alerts. Provided as managed platform services on top of API-captured transaction data rather than
    as self-serve public REST endpoints.
- aid: numeral:webhooks
  name: Numeral Webhooks
  tags:
  - Webhooks
  - Events
  - Notifications
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.numeral.com/api-reference/introduction
  baseURL: https://api.numeralhq.com
  properties:
  - url: https://docs.numeral.com/api-reference/introduction
    type: Documentation
  description: >-
    Event notifications for compliance and transaction lifecycle changes (e.g., filing, registration,
    and nexus events). Webhook delivery is offered through the Numeral platform; no public webhook subscription
    endpoint is documented in the REST API reference as of this writing (see review.yml).
