aid: numeral
url: https://raw.githubusercontent.com/api-evangelist/numeral/refs/heads/main/apis.yml
name: Numeral
kind: company
description: Numeral (Numeral HQ) is a sales-tax compliance and automation platform
  for ecommerce and SaaS companies. Its REST API calculates real-time sales tax by
  customer location at state, county, city, and district granularity, records transactions
  and refunds, and manages products and customers, while the broader platform handles
  registrations, nexus monitoring, filing, and remittance. Not to be confused with
  Numeral (numeral.io), an unrelated payment-operations company now part of Mambu.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Sales Tax
- Tax Compliance
- Tax Calculation
- Ecommerce
- SaaS
created: '2026-06-21'
modified: '2026-06-21'
specificationVersion: '0.19'
apis:
- aid: numeral:tax-calculations
  name: Numeral Tax Calculations API
  tags:
  - Tax Calculation
  - Sales Tax
  - Rates
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.numeral.com/api-reference/introduction
  baseURL: https://api.numeralhq.com
  properties:
  - url: https://docs.numeral.com/api-reference/introduction
    type: Documentation
  - url: https://docs.numeral.com/api-reference/v2026-03-01/endpoint/calculations
    type: APIReference
  - url: openapi/numeral-openapi.yml
    type: OpenAPI
  - url: collections/numeral.postman_collection.json
    type: PostmanCollection
  - url: collections/numeral.opencollection.json
    type: OpenCollection
  description: Calculates real-time sales tax for a given product, customer, and address
    or IP at state, county, city, and district granularity, returning per-line-item
    and total tax amounts. Includes platform/marketplace calculations.
- aid: numeral:transactions
  name: Numeral Transactions API
  tags:
  - Transactions
  - Sales
  - Refunds
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.numeral.com/api-reference/v2026-03-01/endpoint/transactions
  baseURL: https://api.numeralhq.com
  properties:
  - url: https://docs.numeral.com/api-reference/v2026-03-01/endpoint/transactions
    type: Documentation
  - url: openapi/numeral-openapi.yml
    type: OpenAPI
  - url: collections/numeral.postman_collection.json
    type: PostmanCollection
  - url: collections/numeral.opencollection.json
    type: OpenCollection
  description: Records completed sales against a prior calculation, retrieves and deletes
    transactions, and manages refunds and refund reversals that feed downstream filing
    and remittance.
- aid: numeral:filings
  name: Numeral Filings API
  tags:
  - Filings
  - Remittance
  - Autofile
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.numeral.com/product/api
  baseURL: https://api.numeralhq.com
  properties:
  - url: https://docs.numeral.com/api-reference/introduction
    type: Documentation
  - url: https://www.numeral.com/pricing
    type: Plans
  description: Sales-tax return filing and remittance (Autofile) across all US states,
    driven by recorded transactions. Filing and remittance are delivered as managed
    platform services rather than self-serve public REST endpoints; transaction data
    captured via the API flows into them.
- aid: numeral:registrations-nexus
  name: Numeral Registrations & Nexus API
  tags:
  - Registrations
  - Nexus
  - Monitoring
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.numeral.com/product/api
  baseURL: https://api.numeralhq.com
  properties:
  - url: https://docs.numeral.com/api-reference/introduction
    type: Documentation
  - url: https://www.numeral.com/pricing
    type: Plans
  description: State sales-tax registration (Autoregister) and physical/economic nexus
    monitoring with state-crossing alerts. Provided as managed platform services on
    top of API-captured transaction data rather than as self-serve public REST endpoints.
- aid: numeral:tax-codes
  name: Numeral Products & Tax Codes API
  tags:
  - Products
  - Tax Codes
  - Classification
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.numeral.com/api-reference/v2026-03-01/endpoint/products
  baseURL: https://api.numeralhq.com
  properties:
  - url: https://docs.numeral.com/api-reference/v2026-03-01/endpoint/products
    type: Documentation
  - url: openapi/numeral-openapi.yml
    type: OpenAPI
  - url: collections/numeral.postman_collection.json
    type: PostmanCollection
  - url: collections/numeral.opencollection.json
    type: OpenCollection
  description: Creates, categorizes, lists, and deletes products and maps them to
    tax-code product categories that drive correct taxability, plus customer records
    with tax-exemption status.
- aid: numeral:webhooks
  name: Numeral Webhooks
  tags:
  - Webhooks
  - Events
  - Notifications
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.numeral.com/api-reference/introduction
  baseURL: https://api.numeralhq.com
  properties:
  - url: https://docs.numeral.com/api-reference/introduction
    type: Documentation
  description: Event notifications for compliance and transaction lifecycle changes
    (e.g., filing, registration, and nexus events). Webhook delivery is offered through
    the Numeral platform; no public webhook subscription endpoint is documented in
    the REST API reference as of this writing (see review.yml).
